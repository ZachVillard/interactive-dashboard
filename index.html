<!DOCTYPE html>
<html lang="en">
<!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Zach Villard for the WEB-115 course at Wake Tech</p>
    <link rel="stylesheet" href="css/style.css">
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
        //The <noscript> is for web browsers with JavaScript rendering disabled.
    </script>
    <br>
    <br>
    <noscript>
            document.write("Unfortunately, your web browser does not support JavaScript.");
    </noscript>
    <div class="container">
        <div class="row">
        <!-- Dashboard Content -->
            <div class="col" id="weekly-tasks">
                Name: <input type="text" id="myName"><br>
                Daily Task Goal: <input type="text" id="dtg"><br>
                Weekly Bonus Tasks: <input type="text" id="wbt"><br>
                <button type="button" id="goal-btn">Calculate Goal</button>
                <p id="goal-message"></p>
                <script src="js/task-manager.js" defer></script>
            </div>
            <br>
            <br>
            <div class="col" id="metric-converter">
                Input Number: <input type="text" id="numInput"><br>
                <select id="convert" name="Select Measurement">
                    <option value="in_To_cm">Inches to Centimeters</option>
                    <option value="ft_To_cm">Feet to Centimeters</option>
                    <option value="yd_To_m">Yards to Meters</option>
                    <option value="mi_To_km">Miles to Kilometers</option>
                    <option value="cm_To_in">Centimeters to Inches</option>
                    <option value="cm_To_ft">Centimeters to Feet</option>
                    <option value="m_To_yd">Meters to Yards</option>
                    <option value="km_To_mi">Kilometers to Miles</option>
                </select><br>
                <button type="button" id="convert-btn">Convert</button>
                <p id="convertOutput"></p>
                <script src="js/metric-converter.js" defer></script>
            </div>
            <div class="col" id="magic-eight-ball">
                <script src="js/magic-eight-ball.js" defer></script>
                <link rel="stylesheet" href="css/magic-eight-ball.css">
                <h2 class="heading">Magic Eight Ball</h2>
                    <form>
                        <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                        <input id="question" name="question" size="80">
                        <div id="magicEightBall">
                            <div id="circle"></div>
                            <img id="ball" src="img/magic-eight-ball.png"/>
                        </div>
                        <button id="reset" name="reset" type="reset">Ask another question</button>
                    </form>
                    <br>
            </div>
            <br>
            <br>
        </div>
    </div>
</body>
</html>
